<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- http://getbootstrap.com/docs/5.3/ -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <title>{% block title %}{% endblock %}</title>

    </head>

    <body>
        <nav class="navbar" style="background-color: #79ba97;">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="/static/clipart3048682.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    Day Spa
                </a>
                {% if session["user_id"] %}
                    <ul class="nav nav-pills">
                        <li class="nav-item">
                            <a class="nav-link {{ 'active' if current_route == 'index' else '' }}" href="/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {{ 'active' if current_route == 'account' else '' }}" href="/account">Account</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {{ 'active' if current_route == 'login' else '' }}" href="/login">Log Out</a>
                        </li>
                    </ul>
                {% else %}
                    <ul class="nav nav-pills">
                        <li class="nav-item">
                            <a class="nav-link {{ 'active' if current_route == 'register' else '' }}" href="/register">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {{ 'active' if current_route == 'login' else '' }}" href="/login">Log In</a>
                        </li>
                    </ul>
                {% endif %}
            </div>
        </nav>

        {% if get_flashed_messages() %}
            <header>
                <div class="alert alert-primary mb-0 text-center" role="alert">
                    {{ get_flashed_messages() | join(" ") }}
                </div>
            </header>
        {% endif %}

        <main class="container py-5 text-center">
            {% block main %}{% endblock %}
        </main>

        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    </body>

</html>
